prompt = "使用 `$xiaozhao-robot-2` 执行小昭招聘机器人2.2完整筛选主流程。永久优先使用 Codex 支持的 Chrome 插件控制用户现有 Google Chrome 会话；当 Chrome 插件不可用、被阻断或必须进行可见屏幕交互时，再使用 Computer Use；禁止使用 Chrome CDP、Chrome DevTools Protocol、remote debugging、127.0.0.1:9222、/json/version、隐藏浏览器会话或非 Codex 浏览器自动化库；CDP 不可用不是故障，不得阻止流程启动。若运行前发现 GPT/Codex/Hermes 主模型通道无法启动、认证失败、长时间无响应或被确认不可用，不启动 BOSS，先运行 `python3 skills/zhipin-boss-recruitment-bot/scripts/risk_feishu_alert.py --task \"小昭/BOSS 自动化\" --reason \"GPT/主模型通道无法使用\"` 通知程序/管理员；DeepSeek/MiniMax 仅作为该脚本可选补充，不作为主流程依赖。运行窗口为本地机器/中国时区周一到周六 08:00-20:00，窗口外、中国法定节假日或用户暂停时只记录跳过原因，不操作 BOSS。启动时发飞书群普通通知：现在开始工作，不截图、不 @ 钟苗。结束时发飞书群普通通知：到点了，下班！，不截图、不 @ 钟苗；若结束时正在处理候选人，先完成当前候选人的读取、硬性条件检查、BOSS 转发或缺失记录后再结束。流程：读取 BOSS「职位管理 -> 开放中」岗位列表，只检查是否存在于用户提供 JD 库，不点击岗位详情抓取 JD；缺 JD 时通知钟苗：jd库里没有xxx岗位的jd，请提供。进入「推荐牛人」后只处理「最新」标签，不再去「推荐」标签找候选人；启动或恢复流程时最多允许刷新一次 BOSS 页面用于同步状态，刷新一次后本轮流程严禁再次刷新或重载；岗位切换和循环继续在当前页面内操作，不得重复刷新。不点击「精选」。在「最新」列表页，每个可见候选人批次都先读取列表姓名、年龄、学历，先查 SQLite 总表 processed_candidates 按规范化 candidate_key 全局去重，再按当前岗位年龄/学历硬性要求预筛。列表筛选完先把本批列表候选人的最小信息记录好，再处理列表通过的候选人在线简历；候选人是否合格都必须记录最小信息，确保后续查重使用；年龄或学历明确不符合时不打开在线简历。列表阶段只判断年龄和学历，其他硬性条件必须打开完整在线简历后判断。只有未重复且年龄/学历符合，或列表信息不足必须在线确认时，才点击候选人名字打开在线简历，禁止点击头像。在线简历打开后记录 online_resume_viewed，完整滑到底，读取候选人的所有简历信息并按照 HR 提供 JD 的硬性要求去分析；忽略底部的其他名校毕业的牛人、相似候选人信息。持久化只保存 SQLite 最小候选人信息：总表保存岗位、姓名、年龄、学历用于全局查重；每日表只保存日期和候选人姓名用于日报/周报统计；不写 JSON/JSONL，不保存完整在线简历信息到新表。根据 HR 提供 JD 的硬性要求去分析判断是否合适，缺少直接证据就视为硬性条件未满足。当候选人满足当前岗位的全部硬性要求时，在 BOSS 站内直接转发简历给张女士/张晓珠。转发时优先直接点击张女士，张晓珠仅作为身份别名确认。岗位循环：不再使用全局每日120份本地额度。只在「最新」标签筛选，每个开放岗位累计打开在线简历30份后，在不刷新浏览器页面的前提下切换下一个岗位；所有开放岗位在「最新」都达到30份后，不刷新页面，直接从第一个开放岗位重新开始同样的「最新」30份循环。一直运行到时间窗口结束、无可处理候选人、用户停止或安全停止；不使用转发成功数量作为切换岗位条件。严格串行，不并发。每 5 个候选人 checkpoint；转发成功、切换岗位、故障、阻断或安全停止时立即 checkpoint。红线：每轮流程最多刷新一次 BOSS 页面，禁止第二次及以上刷新/重载；禁止点击打招呼、举报、不合适、收藏/已收藏；禁止岗位删除、复制、保存发布、关闭；禁止打开或关闭浏览器、标签页、应用。页面健康判断：不要使用任何单个人名或候选人姓名判断页面是否正常；在当前 BOSS 页面看到职位管理、推荐牛人等核心入口，且没有登录、验证码、滑动验证、短信验证、安全验证或账号异常提示，才按页面正常处理。任何状态改变点击前必须确认截图位置、结构树文本和页面层级一致。若遇登录、验证码、滑动验证、短信验证、安全验证、账号异常、无法启动或歧义 UI，立即停止 BOSS 操作；故障/阻断才截图并 @ 钟苗，按规则发送 boss登陆异常，请检查～ 或 BOSS筛选任务未正常启动，请检查～ 或 流程故障，故障如下。日报/周报 Token 口径使用本机 Codex 当天 session 总消耗。"
